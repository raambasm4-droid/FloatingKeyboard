name: Build Floating Keyboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FloatingKeyboard-1.0.0
          path: build/libs/*.jar
